[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "arcanum-local"
version = "0.1.0"
description = "ARCANUM: authoritative Python tabletop core, local development slice"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.118,<1",
  "pydantic>=2.11,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "httpx>=0.28,<1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

